<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="game-entry" content="game/game.ini">

      html, body, #engine-host { width: 100%; height: 100%; margin: 0; overflow: hidden; }
