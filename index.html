<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="game-entry" content="game/game.ini">
    <title>Anachronist</title>
    <style>
      html, body, #engine-host { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: #000; }
      #engine-host { display: grid; place-items: center; position: relative; touch-action: none; }
      canvas { display: block; width: var(--game-width); height: var(--game-height); image-rendering: pixelated; cursor: crosshair; outline: none; touch-action: none; }
      .mobile-settings { position: fixed; z-index: 2; top: max(6px, env(safe-area-inset-top)); right: max(6px, env(safe-area-inset-right)); user-select: none; -webkit-user-select: none; }
      .mobile-settings > button { width: 34px; height: 34px; padding: 0; border: 1px solid #d3a94f; border-radius: 4px; color: #f4d58a; background: #101b34; font-size: 18px; }
      .mobile-settings fieldset { position: absolute; top: 38px; right: 0; width: max-content; margin: 0; padding: 10px; border: 1px solid #d3a94f; color: #f4d58a; background: #101b34; font: 14px sans-serif; }
      .mobile-settings label { display: block; padding: 5px 2px; }
      .mobile-settings .fullscreen-toggle { width: 100%; margin-top: 7px; padding: 6px 8px; border: 1px solid #d3a94f; color: #f4d58a; background: #182746; }
      .mobile-settings[hidden], .mobile-settings fieldset[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="engine-host" aria-busy="true" aria-live="polite">
      <p>Loading game…</p>
    </main>
    <script type="module" src="engine/bootstrap.js"></script>
  </body>
</html>
