; Classic adventure interface, expressed entirely in logical coordinates.
[interface]
default_verb = walk
accessible_label = Anachronist playable demo
font = 8px monospace

[palette]
panel = #172033
active = #526fa3
border = #a8b8d8
text = #ffffff

[message_region]
rect = 0,0,320,16

[sentence_region]
rect = 0,136,320,16

[verb_panel]
region = lower_left
verbs = look, use, take, open, close, talk

[verb.look]
label = Look
rect = 0,152,40,24
[verb.use]
label = Use
rect = 40,152,40,24
[verb.take]
label = Take
rect = 80,152,40,24
[verb.open]
label = Open
rect = 0,176,40,24
[verb.close]
label = Close
rect = 40,176,40,24
[verb.talk]
label = Talk
rect = 80,176,40,24

[inventory_panel]
region = right_of_verbs
origin = 120,152
item_width = 40
item_height = 48
