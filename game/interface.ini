; Classic adventure interface, expressed entirely in logical coordinates.
[interface]
default_verb = walk
accessible_label = Anachronist playable demo
font = 8px monospace

[palette]
panel = #101b34
active = #713f83
border = #d3a94f
shadow = #050914
text = #f4d58a
disabled = #687080

[message_region]
rect = 0,0,320,16
padding = 5

[sentence_region]
rect = 0,136,320,16
padding = 5

[speech]
height = 14
padding = 3
screen_margin = 2
actor_gap = 3
background = #101b34
text = #f4d58a

[verb_panel]
region = lower_left
verbs = look, use, take, open, close, talk

[verb.look]
label = Look
preposition = at
rect = 0,152,40,24
[verb.use]
label = Use
object_preposition = on
rect = 40,152,40,24
[verb.take]
label = Take
rect = 80,152,40,24
[verb.open]
label = Open
rect = 0,176,40,24
[verb.close]
label = Close
rect = 40,176,40,24
[verb.talk]
label = Talk
rect = 80,176,40,24

; Defaults for missing handlers. Placeholders use configured object labels.
[fallback.look]
text = There is nothing more to see about {target}.
[fallback.use]
text = I can't use {target} that way.
[fallback.take]
text = I can't take {target}.
[fallback.open]
text = I can't open {target}.
[fallback.close]
text = I can't close {target}.
[fallback.talk]
text = I can't talk to {target}.
[fallback.use_item]
text = I can't use {first} on {second}.

[inventory_panel]
region = right_of_verbs
origin = 120,152
item_width = 40
item_height = 48
arrow_width = 16
