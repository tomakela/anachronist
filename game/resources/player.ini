; Directional animation placeholders. No image bytes are required: each state
; has an explicit logical frame size and is drawn using its missing color.
[player]
graphic = placeholder.actor
size = 16,32
; The actor moves by the bottom-middle point of the sprite so its position is
; always the point where its feet meet the ground.
origin = 8,32

[animation.walking_left]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,0,16,32,8; 16,0,16,32,8
[animation.idle_left]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,32,16,32,12
[animation.walking_right]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,64,16,32,8; 16,64,16,32,8
[animation.idle_right]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,96,16,32,12
[animation.walking_up]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,128,16,32,8; 16,128,16,32,8
[animation.idle_up]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,160,16,32,12
[animation.walking_down]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,192,16,32,8; 16,192,16,32,8
[animation.idle_down]
graphic = placeholder.actor
width = 16
height = 32
frames = 0,224,16,32,12

; One-shot interaction animations. They intentionally reuse frames from the
; compact demo sheet; games can supply distinct frames for every direction.
[animation.pickup_left]
frames = 0,32,16,32,4; 16,0,16,32,6; 0,32,16,32,4
[animation.pickup_right]
frames = 0,96,16,32,4; 16,64,16,32,6; 0,96,16,32,4
[animation.pickup_up]
frames = 0,160,16,32,4; 16,128,16,32,6; 0,160,16,32,4
[animation.pickup_down]
frames = 0,224,16,32,4; 16,192,16,32,6; 0,224,16,32,4
[animation.use_left]
frames = 0,32,16,32,5; 16,0,16,32,5
[animation.use_right]
frames = 0,96,16,32,5; 16,64,16,32,5
[animation.use_up]
frames = 0,160,16,32,5; 16,128,16,32,5
[animation.use_down]
frames = 0,224,16,32,5; 16,192,16,32,5
