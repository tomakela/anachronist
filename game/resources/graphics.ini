; Graphics metadata. width and height are logical rendering dimensions; when
; either is omitted it is read from the decoded bitmap.
[graphic.placeholder.actor]
path = images/actor.png
width = 16
height = 48
optional = true
missing_color = #d94b4bff

[graphic.placeholder.door]
path = images/door.png
width = 32
height = 64
optional = true
missing_color = #4b78d9ff

; Frames select source rectangles in the sprite sheet. A duration belongs to
; each frame, in VM ticks, so animations may use non-uniform timing.
[graphic.placeholder.clock]
path = images/clock.png
width = 24
height = 24
optional = true
missing_color = #55a868ff
frames = 0,0,24,24,8; 24,0,24,24,14; 48,0,24,24,8
