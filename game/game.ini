; Anachronist package configuration (UTF-8)
[package]
id = anachronist
format_version = 1
script_language_version = 1
entry_script = scripts/main.ana
resource_catalogue = resources/index.ini
graphics = resources/graphics.ini
room_catalogue = rooms/index.ini
interface = interface.ini

[display]
logical_width = 320
logical_height = 200
bit_depth = 32
scaling_filter = nearest
aspect_policy = contain
orientation_policy = any

[runtime]
ticks_per_second = 60
; Screen shake displacement in logical pixels.
shake_amplitude = 2
; Dialogue duration is base + character count * per-character, clamped to the minimum.
text_base_ticks = 30
text_ticks_per_character = 4
text_minimum_ticks = 90
language = en
random_seed_policy = save

[input]
bindings = input.ini

[save]
format_version = 1
slot_policy = game_defined
