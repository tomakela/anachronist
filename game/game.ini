; Anachronist package configuration (UTF-8)
key_taken = false
door_open = false
door_unlocked = false
clock_fallen = false
fallen_clock_taken = false
stick_found = false
notes_written = false
clock_cleaned = false
door_propped = false
coin_thrown = false
wire_fixed = false
lamp_on = false

[package]
id = anachronist
format_version = 1
script_language_version = 1
entry_script = main.ana
resource_catalogue = resources/index.ini
graphics = resources/graphics.ini
room_catalogue = rooms/index.ini
interface = interface.ini
item_catalogue = items/inventory.ini

[display]
logical_width = 320
logical_height = 200
bit_depth = 32
scaling_filter = nearest
aspect_policy = contain
orientation_policy = any

; Bitmap startup loading bar, measured in logical pixels.
[loading]
rectangle_color = #d3a94f
wall_thickness = 2
bar_color = #f4d58a
size = 160,12

[runtime]
ticks_per_second = 60
; Logical pixels walked per tick, and multiplier used for fast walking.
walk_speed = 2
fast_walk_multiplier = 3.5
; Screen shake displacement in logical pixels.
shake_amplitude = 2
; Dialogue duration is base + character count * per-character, clamped to the minimum.
text_base_ticks = 30
text_ticks_per_character = 4
text_minimum_ticks = 90
language = en
random_seed_policy = save

[input]
bindings = input.ini
; Multiplier applied to relative touch movement in drag-cursor mode.
dragging_sensitivity = 2
long_touch_milliseconds = 550
; Logical pixels a held finger may drift without cancelling a long touch.
long_touch_move_tolerance = 8
; A second nearby tap is the touch equivalent of a desktop double-click.
double_touch_milliseconds = 350
double_touch_move_tolerance = 12

[save]
format_version = 1
slot_policy = game_defined

; Script protocol names are package declarations, not browser-host assumptions.
[protocol]
walk_command = walk
take_command = take
player_actor = player
look_verb = look
use_verb = use
use_animation = use
pickup_animation = pickup
