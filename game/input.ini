; Physical bindings map to semantic actions. Visual input layout will be added
; after its design is specified.
[action.pointer_primary]
pointer_button = primary
touch = tap

[action.pointer_secondary]
pointer_button = secondary
touch = long_press

[action.focus_next]
; Tab remains native so keyboard users can reach the settings controls.
keyboard_code = ArrowRight, ArrowDown

[action.focus_previous]
keyboard_code = ArrowLeft, ArrowUp

[action.activate_primary]
keyboard_code = Enter, Space

[action.activate_secondary]
keyboard_code = KeyL

[action.verb_look]
keyboard_code = Digit1

[action.verb_use]
keyboard_code = Digit2

[action.verb_open]
keyboard_code = Digit3

[action.verb_close]
keyboard_code = Digit4

[action.verb_take]
keyboard_code = Digit5

[action.verb_talk]
keyboard_code = Digit6

[action.inventory_next]
keyboard_code = PageDown, BracketRight

[action.inventory_previous]
keyboard_code = PageUp, BracketLeft

[action.dialogue_advance]
keyboard_code = NumpadEnter

[action.cancel]
keyboard_code = Escape
