visited = false

[room]
background_image = hall.background
background_color = #38465c
; Perspective stops are y,scale pairs. The player's scale is interpolated
; between them and clamped beyond the first and last y coordinates.
player_scaling = 70,0.55; 120,1.0; 140,1.15
; Walking speed has its own gentler perspective curve so distant movement stays
; readable without becoming frustratingly slow.
player_walk_speed_scaling = 70,0.8; 120,1.0; 140,1.05
walk_mask = hall.walkable

[spawn.entry]
; The player's position is its foot point, which must begin on a non-black
; pixel of the walk mask. At this x coordinate the floor begins at y = 130.
position = 40,130

[spawn.garden]
