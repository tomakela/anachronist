[package]
name = "anachronist-editor"
version = "0.1.0"
description = "Native shell for the Anachronist game editor"
edition = "2021"

[lib]
name = "anachronist_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
